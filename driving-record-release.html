<style>

<body>

<div class="header">
  <a href="index.html" class="logo" title="All Forms">TA</a>
  <div>
    <h1>Driving Record Release Auto-Fill</h1>
    <p>Truckers Authority · TR Information Services — per-driver consent form</p>
  </div>
</div>

<div class="container" id="app"></div>

<script>
// ─── Config ────────────────────────────────────────────────────────────────
const WORKER  = 'https://zoho-proxy.oscarmh00.workers.dev';
const PDF_URL = 'Driving-Record-Release.pdf';
const FIELD_FONT_SIZE = 9;   // fixed fill font size to match the form's template text

// ─── Worker / Zoho access ────────────────────────────────────────────────────
class AuthRequiredError extends Error {
  constructor() { super('Sign-in required'); this.name = 'AuthRequiredError'; }
}
async function callWorker(url) {
  let res;
  try { res = await fetch(url, { credentials: 'include' }); }
  catch (e) { throw new AuthRequiredError(); }
  if (res.status === 401 || res.status === 403 || res.redirected) throw new AuthRequiredError();
  if (!res.ok) throw new Error(`Worker returned ${res.status}`);
  const ct = res.headers.get('content-type') || '';
  if (!ct.includes('json')) throw new AuthRequiredError();
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}
async function searchDeals(q) {
  const data = await callWorker(`${WORKER}?action=search&word=${encodeURIComponent(q)}`);
  return Array.isArray(data) ? data : [];
}
async function fetchDeal(id) {
  return callWorker(`${WORKER}?action=deal&id=${encodeURIComponent(id)}`);
}
// Drug & Alcohol module record (second source path)
async function fetchDA(id) {
  return callWorker(`${WORKER}?action=da&id=${encodeURIComponent(id)}`);
}

// ─── PDF fill (direct field-fill) ────────────────────────────────────────────
function downloadPDF(bytes, prefix, dealName, driverName) {
  const clean = s => (s || '').replace(/[^a-zA-Z0-9]/g, '_');
  const name  = [clean(dealName) || 'client', clean(driverName)].filter(Boolean).join('_');
  const blob  = new Blob([bytes], { type: 'application/pdf' });
  const a     = document.createElement('a');
  a.href      = URL.createObjectURL(blob);
  a.download  = `${prefix}_${name}.pdf`;
  a.click();
}
async function fillPDF(pdfUrl, fieldValues) {
  const resp = await fetch(pdfUrl, { cache: 'reload' });
  if (!resp.ok) throw new Error(`Could not load form PDF (${resp.status}). Ensure the PDF is in the GitHub repo.`);
  const bytes  = await resp.arrayBuffer();
  const pdfDoc = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption: true });
  const form   = pdfDoc.getForm();
  const helv   = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
  const targetH = FIELD_FONT_SIZE + 5;
  for (const field of form.getFields()) {
    if (!(field instanceof PDFLib.PDFTextField)) continue;
    const name = field.getName();
    const val  = fieldValues[name];
    try {
      // Apply the fixed small font to EVERY text field — including ones we leave blank
      // (Date of Birth, Date, Date_2, Fax) — so staff edits render at the same size
      // instead of the viewer's large auto-size.
      try { field.setFontSize(FIELD_FONT_SIZE); } catch {}
      // Tall boxes vertically-center text, so it floats above the underline. Shrink the
      // box from the top (bottom fixed) so both prefilled AND typed text sit on the line.
      try {
        for (const w of field.acroField.getWidgets()) {
          const r = w.getRectangle();
          if (r.height > targetH) w.setRectangle({ x: r.x, y: r.y, width: r.width, height: targetH });
        }
      } catch {}
      // Fill the value if we have one for this field.
      if (val != null && val !== '') field.setText(String(val));
    } catch {}
  }
  form.getFields().forEach(f => { try { f.updateAppearances(helv); } catch {} });
  // NOT flattened — fields stay editable so staff can adjust values in any PDF viewer.
  // We deliberately do NOT set NeedAppearances: that flag makes viewers discard our
  // generated appearance streams and re-center the text vertically, which lifts it off
  // the line. Leaving it unset means viewers honor the on-the-line positioning above,
  // and fields remain fully editable.
  return pdfDoc.save();
}

// ─── Helpers ─────────────────────────────────────────────────────────────────
function ownerName(deal) {
  return deal.Owner_1_Full_Name || (deal.Contact_Name && deal.Contact_Name.name) || '';
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Format a phone number as (###) ###-#### when it has 10 digits (or 11 leading with 1).
// Falls back to the original value if it isn't a standard US number.
function formatPhone(v) {
  if (v == null) return '';
  let n = String(v).replace(/\D/g, '');
  if (n.length === 11 && n[0] === '1') n = n.slice(1);
  if (n.length === 10) return `(${n.slice(0,3)}) ${n.slice(3,6)}-${n.slice(6)}`;
  return String(v).trim();
}

// Spelled-out state name → USPS 2-letter code (for the narrow "State of Issue" field)
const STATE_ABBR = {
  'Alabama':'AL','Alaska':'AK','Arizona':'AZ','Arkansas':'AR','California':'CA','Colorado':'CO',
  'Connecticut':'CT','Delaware':'DE','District of Columbia':'DC','Florida':'FL','Georgia':'GA',
  'Hawaii':'HI','Idaho':'ID','Illinois':'IL','Indiana':'IN','Iowa':'IA','Kansas':'KS','Kentucky':'KY',
  'Louisiana':'LA','Maine':'ME','Maryland':'MD','Massachusetts':'MA','Michigan':'MI','Minnesota':'MN',
  'Mississippi':'MS','Missouri':'MO','Montana':'MT','Nebraska':'NE','Nevada':'NV','New Hampshire':'NH',
  'New Jersey':'NJ','New Mexico':'NM','New York':'NY','North Carolina':'NC','North Dakota':'ND','Ohio':'OH',
  'Oklahoma':'OK','Oregon':'OR','Pennsylvania':'PA','Rhode Island':'RI','South Carolina':'SC',
  'South Dakota':'SD','Tennessee':'TN','Texas':'TX','Utah':'UT','Vermont':'VT','Virginia':'VA',
  'Washington':'WA','West Virginia':'WV','Wisconsin':'WI','Wyoming':'WY'
};
const STATE_CODES = new Set(Object.values(STATE_ABBR)); // valid USPS 2-letter codes (incl. DC)
// Real US state (2-letter OR spelled-out, any case) → 2-letter code. Anything that is
// not a real state (junk, "N/A", blanks) → '' so the narrow PDF field is left blank.
function stateAbbrev(name) {
  if (!name) return '';
  const key = String(name).trim();
  if (!key) return '';
  if (STATE_ABBR[key]) return STATE_ABBR[key];                 // exact spelled-out
  const up = key.toUpperCase();
  for (const full in STATE_ABBR) {                             // case-insensitive spelled-out
    if (full.toUpperCase() === up) return STATE_ABBR[full];
  }
  if (up.length === 2 && STATE_CODES.has(up)) return up;       // valid 2-letter code
  return '';                                                   // not a real state → blank
}

// License-number cleaner: blank out placeholder values (used on the D&A path).
function cleanLicense(v) {
  if (v == null) return '';
  const s = String(v).trim();
  return ['n/a', 'na', '-none-', 'none', 'tbd', ''].includes(s.toLowerCase()) ? '' : s;
}

// Split a date of birth into { m, d, y } for the form's three DOB boxes
// (Date of Birth = month, undefined = day, undefined_2 = year). Handles Zoho's
// ISO "yyyy-mm-dd" and a US "mm/dd/yyyy" fallback; anything else → all blank.
function splitDOB(v) {
  if (!v) return { m: '', d: '', y: '' };
  const s = String(v).trim();
  let mm, dd, yy;
  const iso = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (iso) { yy = iso[1]; mm = iso[2].padStart(2, '0'); dd = iso[3].padStart(2, '0'); }
  else {
    const us = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
    if (us) { mm = us[1].padStart(2, '0'); dd = us[2].padStart(2, '0'); yy = us[3]; }
  }
  return mm ? { m: mm, d: dd, y: yy } : { m: '', d: '', y: '' };
}
function dobDisplay(v) {
  const p = splitDOB(v);
  return p.m ? `${p.m}/${p.d}/${p.y}` : '';
}

// Applicant extraction — source-pluggable across two Zoho modules.
//   • 'deals' (default): the Deal's Owner_and_Driver subform. Any row with a non-empty
//     Full_Name. The Owner_Driver value is shown as the picker badge (Owner/Driver/—).
//   • 'da': the Drug_and_Alcohol record's Drivers_Information subform. Names are split
//     (First_Name + Last_Name), license fields are named differently (DL_Number/DL_State),
//     and the badge shows the row's Status instead of a role.
// Both branches return rows in ONE internal shape so every downstream renderer and
// mapFields() work unchanged: { Full_Name, Drivers_License_Number, Drivers_License_State,
// Owner_Driver(=badge text), CDL_or_Non_CDL }.
function getApplicants(record, source) {
  source = source || record._source || 'deals';
  if (source === 'da') {
    const rows = Array.isArray(record.Drivers_Information) ? record.Drivers_Information : [];
    return rows
      .filter(r => r && r.First_Name && String(r.First_Name).trim())
      .map(r => ({
        Full_Name: [r.First_Name, r.Last_Name].filter(v => v && String(v).trim()).join(' ').replace(/\s+/g, ' ').trim(),
        Drivers_License_Number: cleanLicense(r.DL_Number),
        Drivers_License_State: r.DL_State || '',
        DOB: r.Birth_Date || '',        // D&A stores DOB as Birth_Date
        Owner_Driver: r.Status || '',   // picker badge shows D&A Status (Active/Inactive/…)
        CDL_or_Non_CDL: null
      }));
  }
  // Default Deals path — unchanged.
  const rows = Array.isArray(record.Owner_and_Driver) ? record.Owner_and_Driver : [];
  return rows.filter(r => r && r.Full_Name && String(r.Full_Name).trim());
}

// Load a D&A record and enrich its Contact Name from the linked Deal (Company lookup).
// The D&A record's own DER_Name is kept only as a fallback when no linked deal/contact.
async function loadDARecord(id) {
  const da  = await fetchDA(id);
  const rec = buildRecordFromDA(da);
  if (da.Company && da.Company.id) {
    try {
      const linked = await fetchDeal(da.Company.id);
      const cn = linked && linked.Contact_Name && linked.Contact_Name.name;
      if (cn) rec.Contact_Name = { name: cn };   // contact from the associated Deal
    } catch (e) { /* keep DER_Name fallback */ }
  }
  return rec;
}

// Normalize a raw Drug_and_Alcohol record into the same internal shape the renderers
// and mapFields() already expect from a Deal. Address policy: Physical_* only.
function buildRecordFromDA(da) {
  return {
    _source: 'da',
    Deal_Name:             da.Name,
    Contact_Name:          da.DER_Name ? { name: da.DER_Name } : null,
    Owner_1_Full_Name:     null,
    Business_Phone_Number: da.Phone,
    Email:                 da.Email || da.DER_Email,
    Physical_Street:       da.Physical_Street,
    Physical_City:         da.Physical_City,
    Physical_State:        da.Physical_State,
    Physical_Zip:          da.Physical_Zip,
    USDOT:                 da.USDOT_Number,
    Drivers_Information:    Array.isArray(da.Drivers_Information) ? da.Drivers_Information : []
  };
}

// Picker / preview badge text. For Deals it's the Owner_Driver role; for D&A it's the
// Status (mapped into Owner_Driver by getApplicants). Blank/-None- → "—".
function roleLabel(row) {
  const v = (row && row.Owner_Driver || '').trim();
  return (!v || v === '-None-') ? '—' : v;
}

// ─── Field mapping → PDF field names (case-sensitive, confirmed via inspection) ─
function mapFields(deal, drv) {
  const f = {};
  const set = (k, v) => { if (v != null && String(v).trim()) f[k] = String(v).trim(); };
  const contact = (deal.Contact_Name && deal.Contact_Name.name) || deal.Owner_1_Full_Name;

  // PAGE 1 — Requester (company)
  set('Company Name',  deal.Deal_Name);
  set('Contact Name',  contact);
  set('Phone',         formatPhone(deal.Business_Phone_Number));
  // 'Fax' — leave blank
  set('Email Address', deal.Email);

  // PAGE 1 — Applicant (driver)
  set('Applicants Name',        drv.Full_Name);
  set('Address',                deal.Physical_Street);
  set('City',                   deal.Physical_City);
  set('St',                     deal.Physical_State);   // already 2-letter in Zoho
  set('Zip',                    deal.Physical_Zip);
  // DOB boxes (month / day / year) from the subform — Deals: DOB, D&A: Birth_Date (mapped to DOB)
  const dob = splitDOB(drv.DOB);
  set('Date of Birth', dob.m);   // month box
  set('undefined',     dob.d);   // day box
  set('undefined_2',   dob.y);   // year box
  set('Phone_2',                formatPhone(deal.Business_Phone_Number));
  set('Driving License Number', drv.Drivers_License_Number);
  set('State of Issue',         stateAbbrev(drv.Drivers_License_State));
  // 'Date' — driver signs/dates in person, leave blank

  // PAGE 2 — Disclosure
  set('The Employer',     deal.Deal_Name);
  set('Applicants Name_2',drv.Full_Name);
  set('Current Address',  deal.Physical_Street);
  set('City_2',           deal.Physical_City);
  set('St_2',             deal.Physical_State);
  set('Zip_2',            deal.Physical_Zip);
  // 'Date_2' — leave blank

  // PAGES 3 & 4 — FCRA boilerplate, no fields
  return f;
}

// ─── UI ──────────────────────────────────────────────────────────────────────
const app = document.getElementById('app');

function renderLoading(msg) {
  app.innerHTML = `<div class="card loading-box"><div class="spinner"></div>${esc(msg)}</div>`;
}
function renderSignIn(retryFn) {
  app.innerHTML = `
    <div class="card">
      <div class="card-title">Sign-in required</div>
      <p style="font-size:14px;color:#475569;margin-bottom:16px">
        Sign in with your <b>@truckersauthority.com</b> account to use this tool.
      </p>
      <button class="btn btn-primary" id="signin">Sign in via Cloudflare</button>
      <p class="hint" style="margin-top:14px">After signing in the tab will close and you'll return here automatically.</p>
    </div>`;
  document.getElementById('signin').onclick = () => {
    const w = window.open(WORKER, 'tasignin', 'width=520,height=640');
    const t = setInterval(() => {
      if (!w || w.closed) { clearInterval(t); if (retryFn) retryFn(); else location.reload(); }
    }, 500);
  };
}

// Deal search (shown when no ?id= param)
function renderSearch(err) {
  app.innerHTML = `
    <div class="card">
      <div class="card-title">Search deal</div>
      <div class="search-row">
        <input type="text" id="si" placeholder="Company name, DOT #, owner name…" autofocus>
        <button class="btn btn-primary" id="sb">Search →</button>
      </div>
      ${err ? `<div class="error-box">${esc(err)}</div>` : ''}
      <p class="hint" style="margin-top:10px">Search any Deal from Zoho CRM by company name or DOT number.</p>
    </div>`;
  const go = async () => {
    const q = document.getElementById('si').value.trim();
    if (!q) return;
    renderLoading(`Searching for "${q}"…`);
    try {
      const results = await searchDeals(q);
      if (!results.length) renderSearch(`No deals found for "${q}".`);
      else renderDealPick(results);
    } catch(e) {
      if (e instanceof AuthRequiredError) renderSignIn(go);
      else renderSearch('Error: ' + e.message);
    }
  };
  document.getElementById('sb').onclick = go;
  document.getElementById('si').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

function renderDealPick(results) {
  app.innerHTML = `
    <div class="card">
      <div class="back-row">
        <div class="card-title" style="margin-bottom:0">Select a deal</div>
        <button class="btn btn-ghost" id="bb">← Back</button>
      </div>
      ${results.map(r => `<div class="result-item" data-id="${esc(r.id)}">
        <div>
          <div class="result-name">${esc(r.Deal_Name || r.id)}</div>
          <div class="result-meta">${[r.Stage, r.USDOT ? 'DOT# ' + r.USDOT : null, r.Owner_1_Full_Name, [r.Physical_City, r.Physical_State].filter(Boolean).join(', ')].filter(Boolean).map(esc).join('  ·  ')}</div>
        </div>
        <span style="color:#94a3b8;font-size:20px">›</span>
      </div>`).join('')}
    </div>`;
  document.getElementById('bb').onclick = () => renderSearch(null);
  document.querySelectorAll('.result-item').forEach(el => {
    el.onclick = async () => {
      renderLoading('Loading ' + el.querySelector('.result-name').textContent + '…');
      try { onDealLoaded(await fetchDeal(el.dataset.id)); }
      catch(e) {
        if (e instanceof AuthRequiredError) renderSignIn(() => el.onclick());
        else renderSearch('Error: ' + e.message);
      }
    };
  });
}

// Decide: picker, straight-to-preview, or no-applicants
function onDealLoaded(deal) {
  const applicants = getApplicants(deal, deal._source);
  if (applicants.length === 0)      renderNoApplicants(deal);
  else if (applicants.length === 1) renderPreview(deal, applicants[0], applicants);
  else                              renderApplicantPicker(deal, applicants);
}

function renderNoApplicants(deal) {
  const isDA = deal._source === 'da';
  const where = isDA ? "this record's Drivers Information subform" : "this Deal's Owner and Driver subform";
  const fix   = isDA ? 'with at least a <b>First Name</b>' : 'with at least a <b>Full Name</b>';
  app.innerHTML = `
    <div class="card">
      <div class="back-row">
        <div><div class="card-title" style="margin-bottom:0">No applicants found</div><div class="deal-title">${esc(deal.Deal_Name || '')}</div></div>
        <button class="btn btn-ghost" id="bb">← Search</button>
      </div>
      <div class="warn-box" style="margin-bottom:0">
        No one found in ${where}.
        Add a row first ${fix} in Zoho, then reload this page.
      </div>
    </div>`;
  document.getElementById('bb').onclick = () => renderSearch(null);
}

function renderApplicantPicker(deal, applicants) {
  app.innerHTML = `
    <div class="card">
      <div class="back-row">
        <div><div class="card-title" style="margin-bottom:0">Select an applicant</div><div class="deal-title">${esc(deal.Deal_Name || '')}</div></div>
        <button class="btn btn-ghost" id="bb">← Search</button>
      </div>
      <p class="hint" style="margin-top:0;margin-bottom:14px">This form is generated per person. Pick whoever is having their driving record pulled.</p>
      ${applicants.map((d, i) => `<div class="driver-item" data-i="${i}">
        <div>
          <div class="driver-name">${esc(d.Full_Name || '(no name)')}<span class="role-badge">${esc(roleLabel(d))}</span></div>
          <div class="driver-meta">${[d.Drivers_License_Number ? 'DL: ' + d.Drivers_License_Number : null, d.Drivers_License_State ? '(' + stateAbbrev(d.Drivers_License_State) + ')' : null, d.CDL_or_Non_CDL].filter(Boolean).map(esc).join('  ·  ')}</div>
        </div>
        <span style="color:#94a3b8;font-size:20px">›</span>
      </div>`).join('')}
    </div>`;
  document.getElementById('bb').onclick = () => renderSearch(null);
  document.querySelectorAll('.driver-item').forEach(el => {
    el.onclick = () => renderPreview(deal, applicants[+el.dataset.i], applicants);
  });
}

function fRow(label, value) {
  return !value ? '' : `<div class="field-row"><span class="field-label">${esc(label)}</span><span class="field-value">${esc(value)}</span></div>`;
}

function renderPreview(deal, drv, applicants) {
  const multi = applicants && applicants.length > 1;
  const issue = stateAbbrev(drv.Drivers_License_State);
  const cityLine = [deal.Physical_City, deal.Physical_State, deal.Physical_Zip].filter(Boolean).join(', ');
  app.innerHTML = `
    <div class="card">
      <div class="back-row">
        <div><div class="card-title" style="margin-bottom:0">Confirm data</div><div class="deal-title">${esc(deal.Deal_Name || '')}</div></div>
        <button class="btn btn-ghost" id="bb">← ${multi ? 'Applicants' : 'Search'}</button>
      </div>
      <div class="owner-box">
        <div class="section-label">Applicant${roleLabel(drv) !== '—' ? ' — ' + esc(roleLabel(drv)) : ''}</div>
        ${fRow('Applicants Name', drv.Full_Name)}
        ${fRow('Date of Birth', dobDisplay(drv.DOB))}
        ${fRow('Driving License Number', drv.Drivers_License_Number)}
        ${fRow('State of Issue', (issue || '—') + (drv.Drivers_License_State ? `  (${drv.Drivers_License_State})` : ''))}
      </div>
      <div class="section">
        <div class="section-label">Requester (Company)</div>
        ${fRow('Company Name', deal.Deal_Name)}
        ${fRow('Contact Name', (deal.Contact_Name && deal.Contact_Name.name) || deal.Owner_1_Full_Name)}
        ${fRow('Phone', formatPhone(deal.Business_Phone_Number))}
        ${fRow('Email Address', deal.Email)}
      </div>
      <div class="section">
        <div class="section-label">Address</div>
        ${fRow('Street', deal.Physical_Street)}
        ${fRow('City / St / Zip', cityLine)}
      </div>
      <div class="warn-box" style="margin-top:8px">
        ⚠ Signature lines and signature dates are left blank for the driver to sign in person. Date of Birth is prefilled when on file in Zoho. Pages 3–4 (FCRA notices) are unchanged.
      </div>
      <button class="btn btn-success" id="gb">⬇ Generate &amp; Download Driving Record Release</button>
      <div id="ge" class="error-box" style="display:none"></div>
    </div>`;
  document.getElementById('bb').onclick = () => multi ? renderApplicantPicker(deal, applicants) : renderSearch(null);
  document.getElementById('gb').onclick = async () => {
    const btn = document.getElementById('gb');
    btn.disabled = true; btn.textContent = 'Generating PDF…';
    try {
      const bytes = await fillPDF(PDF_URL, mapFields(deal, drv));
      downloadPDF(bytes, 'Driving_Record_Release', deal.Deal_Name, drv.Full_Name);
      renderDone(deal, drv, applicants);
    } catch(e) {
      const err = document.getElementById('ge');
      err.style.display = 'block'; err.textContent = 'Error: ' + e.message;
      btn.disabled = false; btn.textContent = '⬇ Generate & Download Driving Record Release';
    }
  };
}

function renderDone(deal, drv, applicants) {
  app.innerHTML = `
    <div class="card">
      <div class="success-box">
        <div class="check-circle">✓</div>
        <h2 style="font-size:20px;font-weight:600;margin-bottom:6px">Driving Record Release Downloaded!</h2>
        <p style="color:#64748b;font-size:14px;margin-bottom:24px">${esc(deal.Deal_Name || '')} — ${esc(drv.Full_Name || '')}</p>
        ${applicants && applicants.length > 1 ? `<button class="btn btn-primary" id="db" style="margin-right:8px">Pick Another Applicant</button>` : ''}
        <button class="btn btn-ghost" id="ab" style="margin-right:8px">Search Another Deal</button>
        <button class="btn btn-ghost" id="rb">Re-download PDF</button>
      </div>
    </div>`;
  if (applicants && applicants.length > 1) document.getElementById('db').onclick = () => renderApplicantPicker(deal, applicants);
  document.getElementById('ab').onclick = () => renderSearch(null);
  document.getElementById('rb').onclick = async () => {
    try { downloadPDF(await fillPDF(PDF_URL, mapFields(deal, drv)), 'Driving_Record_Release', deal.Deal_Name, drv.Full_Name); }
    catch(e) { alert('Error: ' + e.message); }
  };
}

// ─── Boot: handle deep-links from the "Generate Form" button ──────────────────
//   ?id=DEAL_ID                → Deals path (default)
//   ?id=DA_RECORD_ID&module=da → Drug & Alcohol path
(async function boot() {
  const params = new URLSearchParams(window.location.search);
  const id     = params.get('id');
  const isDA   = (params.get('module') || '').toLowerCase() === 'da';
  if (!id) { renderSearch(null); return; }

  const msg  = isDA ? 'Loading record from Zoho CRM…' : 'Loading deal from Zoho CRM…';
  const load = isDA
    ? async () => onDealLoaded(await loadDARecord(id))
    : async () => onDealLoaded(await fetchDeal(id));

  renderLoading(msg);
  try { await load(); }
  catch(e) {
    if (e instanceof AuthRequiredError) {
      renderSignIn(async () => {
        renderLoading(msg);
        try { await load(); }
        catch(err) { renderSearch('Could not load record: ' + err.message); }
      });
    } else {
      renderSearch('Could not load record: ' + e.message);
    }
  }
})();
</script>
</body>
</html>
