// âââ Worker helpers ââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
class AuthRequiredError extends Error {
  constructor() { super('Sign-in required'); this.name = 'AuthRequiredError'; }
}

async function callWorker(url) {
  let res;
  try { res = await fetch(url, { credentials: 'include' }); } catch { throw new AuthRequiredError(); }
  if (res.status === 401 || res.status === 403 || res.redirected) throw new AuthRequiredError();
  if (!res.ok) throw new Error(`Worker returned ${res.status}`);
  const ct = res.headers.get('content-type') || '';
  if (!ct.includes('json')) throw new AuthRequiredError();
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

async function searchDeals(q) {
  const data = await callWorker(`${WORKER}?action=search&word=${encodeURIComponent(q)}`);
  return Array.isArray(data) ? data : [];
}

async function fetchDeal(id) {
  return callWorker(`${WORKER}?action=deal&id=${encodeURIComponent(id)}`);
}

// âââ PDF helpers âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
function downloadPDF(bytes, prefix, dealName) {
  const name = (dealName || 'client').replace(/[^a-zA-Z0-9]/g, '_');
  const blob = new Blob([bytes], { type: 'application/pdf' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${prefix}_${name}.pdf`;
  a.click();
}

// Resolve virtual field names to actual deal values
function resolveField(fieldKey, deal) {
  const owner = deal.Owner_1_Full_Name || (deal.Contact_Name && deal.Contact_Name.name) || '';
  const mailStreet = deal.Mailing_Street || deal.Physical_Street || '';
  const mailCity   = deal.Mailing_City   || deal.Physical_City   || '';
  const mailState  = deal.Mailing_State  || deal.Physical_State  || '';
  const mailZip    = deal.Mailing_Zip_Code || deal.Physical_Zip  || '';

  const map = {
    Deal_Name:                    deal.Deal_Name || '',
    Physical_Street:              deal.Physical_Street || '',
    Physical_City:                deal.Physical_City || '',
    Physical_State:               deal.Physical_State || '',
    Physical_Zip:                 deal.Physical_Zip || '',
    Mailing_Street_or_Physical_Street: mailStreet,
    Mailing_City_or_Physical_City:     mailCity,
    Mailing_State_or_Physical_State:   mailState,
    Mailing_Zip_or_Physical_Zip:       mailZip,
    Business_Phone_Number:        deal.Business_Phone_Number || '',
    Email:                        deal.Email || '',
    USDOT:                        deal.USDOT || '',
    MC_Number:                    deal.MC_Number || '',
    Owner_1_Full_Name:            owner,
  };
  return map[fieldKey] || '';
}

// Determine which business structure checkbox to mark
function getBizCheckbox(deal) {
  const biz = (deal.Business_Structure || '').toLowerCase();
  if (biz.includes('llp') || biz.includes('limited liability partnership')) return 'llp';
  if (biz.includes('llc') || biz.includes('limited liability company'))    return 'llc';
  if (biz.includes('corp'))                                                  return 'corp';
  if (biz.includes('limited partnership'))                                   return 'lp';
  if (biz.includes('sole'))                                                  return 'sole';
  if (biz.includes('partner'))                                               return 'partner';
  return 'sole'; // default
}

async function fillAlabama14A(deal) {
  const resp = await fetch(PDF_URL, { cache: 'reload' });
  if (!resp.ok) throw new Error(`Could not load form PDF (${resp.status})`);
  const bytes  = await resp.arrayBuffer();
  const pdfDoc = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption: true });
  const helv   = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
  const pages  = pdfDoc.getPages();
  const fontSize = 10;
  const color = PDFLib.rgb(0, 0, 0);

  // Draw all coordinate-mapped fields
  for (const [key, coord] of Object.entries(COORDS)) {
    const value = resolveField(coord.field, deal);
    if (!value) continue;
    const page = pages[coord.page];
    if (!page) continue;
    try {
      page.drawText(value, {
        x: coord.x,
        y: coord.y,
        size: fontSize,
        font: helv,
        color,
      });
    } catch {}
  }

  // Draw business structure checkbox (X marker)
  const cbKey = getBizCheckbox(deal);
  const cb = BIZ_CHECKBOXES[cbKey];
  if (cb) {
    const page = pages[cb.page];
    if (page) {
      try {
        page.drawText('X', {
          x: cb.x, y: cb.y,
          size: 11,
          font: helv,
          color: PDFLib.rgb(0, 0, 0),
        });
      } catch {}
    }
  }

  return pdfDoc.save();
}

function today() {
  const d = new Date();
  return String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0') + '/' + d.getFullYear();
}

function ownerName(deal) {
  return deal.Owner_1_Full_Name || (deal.Contact_Name && deal.Contact_Name.name) || '';
}

function fRow(label, value) {
  return !value ? '' : `<div class="field-row"><span class="field-label">${label}</span><span class="field-value">${value}</span></div>`;
}

function bizLabel(deal) {
  const biz = (deal.Business_Structure || '').toLowerCase();
  if (biz.includes('llp'))  return 'LLP';
  if (biz.includes('llc'))  return 'LLC';
  if (biz.includes('corp')) return 'Corporation';
  if (biz.includes('limited partnership')) return 'Limited Partnership';
  if (biz.includes('sole')) return 'Sole Proprietorship';
  if (biz.includes('partner')) return 'Partnership';
  return deal.Business_Structure || 'Sole Proprietorship (default)';
}

          <div class="result-meta">${[r.Stage,r.USDOT?'DOT# '+r.USDOT:null,r.Owner_1_Full_Name,[r.Physical_City,r.Physical_State].filter(Boolean).join(', ')].filter(Boolean).join('  Â·  ')}</div>
        </div>
        <span style="color:#94a3b8;font-size:20px">âº</span>
      </div>`).join('')}
    </div>`;
  document.getElementById('bb').onclick = () => renderSearch(null, searchFn);
  document.querySelectorAll('.result-item').forEach(el => {
    el.onclick = async () => {
      renderLoading('Loading ' + el.querySelector('.result-name').textContent + 'â¦');
      try { searchFn(await fetchDeal(el.dataset.id)); }
      catch(e) { renderSearch('Error: ' + e.message, searchFn); }
    };
  });
}

// âââ Preview & Download ââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
function renderPreview(deal) {
  const owner = ownerName(deal);
  const isAL  = (deal.Physical_State || '').toUpperCase() === 'AL';
  const mailStreet = deal.Mailing_Street || deal.Physical_Street;

  app.innerHTML = `
    <div class="card">
      <div class="back-row">
        <div>
          <div class="card-title" style="margin-bottom:0">Confirm data</div>
          <div class="deal-title">${deal.Deal_Name}</div>
        </div>
        <button class="btn btn-ghost" id="bb">â Back</button>
      </div>
      ${!isAL ? `<div class="warn-box">â  Physical State is <b>${deal.Physical_State || '(blank)'}</b>, not AL. Confirm this is correct.</div>` : ''}
      ${!deal.Owner_1_Full_Name ? `<div class="warn-box">â  Owner 1 Full Name is blank â using Contact Name as fallback.</div>` : ''}
      <div class="owner-box">

        ${fRow('Name of Affiant', owner)}
        ${fRow('County of', deal.Physical_City)}
        ${fRow('State of', deal.Physical_State)}

      <div class="section">

        ${fRow('Legal Name', deal.Deal_Name)}
        ${fRow('Business Address', deal.Physical_Street)}
        ${fRow('City', deal.Physical_City)}
        ${fRow('State', deal.Physical_State)}
        ${fRow('Zip', deal.Physical_Zip)}
        ${fRow('Mailing Address', mailStreet || '(same as physical)')}
        ${fRow('Phone', deal.Business_Phone_Number)}
        ${fRow('Email', deal.Email)}
      </div>
      <div class="section">
        <div class="section-label">Section II â Business Type (Page 1)</div>
        ${fRow('Structure', bizLabel(deal))}
        ${fRow('USDOT #', deal.USDOT)}
        ${fRow('MC #', deal.MC_Number)}
      </div>
      <div class="section">
        <div class="section-label">Appendix B + Form B-2 (Pages 4 &amp; 7)</div>
        ${fRow('Legal Name', deal.Deal_Name)}
        ${fRow('Mailing Address', mailStreet || deal.Physical_Street)}
      </div>
      <div class="warn-box">â  <b>Coordinate overlay:</b> This form has no fillable fields. Text is drawn at fixed positions over the PDF. Review all pages carefully after download and correct any misaligned fields by hand.</div>
      <div class="warn-box" style="margin-top:0">â  Sections IIIâV, Appendices CâD, vehicle lists, insurance attachments, and the $100 filing fee must be completed manually.</div>
      <p class="hint">The PDF stays editable after download â you can add text annotations in Acrobat or Preview.</p>
      <button class="btn btn-success" id="gb">â¬ Generate &amp; Download Alabama Form 14A</button>
      <div id="ge" class="error-box" style="display:none"></div>
    </div>`;

  document.getElementById('bb').onclick = () => renderSearch(null, renderPreview);
  document.getElementById('gb').onclick = async () => {
    const btn = document.getElementById('gb');
    btn.disabled = true; btn.textContent = 'Generating PDFâ¦';
    try {
      const bytes = await fillAlabama14A(deal);
      downloadPDF(bytes, 'AL-Form-14A', deal.Deal_Name);
      renderDone(deal);
    } catch(e) {
      const err = document.getElementById('ge');
      err.style.display = 'block'; err.textContent = 'Error: ' + e.message;
      btn.disabled = false; btn.textContent = 'â¬ Generate & Download Alabama Form 14A';
    }
  };
}

function renderDone(deal) {
  app.innerHTML = `
    <div class="card">
      <div class="success-box">
        <div class="check-circle">â</div>
        <h2 style="font-size:20px;font-weight:600;margin-bottom:6px">Alabama Form 14A Downloaded!</h2>
        <p style="color:#64748b;font-size:14px;margin-bottom:4px">${deal.Deal_Name}</p>
        <p style="color:#92400e;font-size:12px;background:#fefce8;border:1px solid #fde68a;padding:8px 12px;border-radius:6px;margin-bottom:20px">Review all 7 pages carefully â text is overlaid at fixed coordinates. Correct any misaligned fields by hand before submitting.</p>
        <button class="btn btn-primary" id="ab" style="margin-right:8px">Generate Another</button>
        <button class="btn btn-ghost" id="rb">Re-download PDF</button>
      </div>
    </div>`;
  document.getElementById('ab').onclick = () => renderSearch(null, renderPreview);
  document.getElementById('rb').onclick = async () => {
    try { downloadPDF(await fillAlabama14A(deal), 'AL-Form-14A', deal.Deal_Name); }
    catch(e) { alert('Error: ' + e.message); }

}

// âââ Boot ââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
(async function boot() {
  const id = new URLSearchParams(window.location.search).get('id');
  if (id) {
    renderLoading('Loading deal from Zoho CRMâ¦');
    try { renderPreview(await fetchDeal(id)); }
    catch(e) {
      if (e instanceof AuthRequiredError) {
        renderSignIn(async () => {
          renderLoading('Loading deal from Zoho CRMâ¦');
          try { renderPreview(await fetchDeal(id)); }
          catch(err) { renderSearch('Could not load deal: ' + err.message, renderPreview); }
        });
      } else {
        renderSearch('Could not load deal: ' + e.message, renderPreview);
      }
    }
  } else {
    renderSearch(null, renderPreview);
  }
})();
</script>
