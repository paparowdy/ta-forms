<div class="header">

    <h1>Alabama Form 14A Auto-Fill</h1>

  </div>

<div class="container" id="app"></div>

<script>
// ─── Config ────────────────────────────────────────────────────────────────
const WORKER  = 'https://zoho-proxy.oscarmh00.workers.dev';
const PDF_URL = 'Alabama-Form-14A.pdf';   // fillable APSC Form 14A (173 AcroForm fields, 7 pages)
const FILL_FONT_SIZE = 10;                 // fill size for every text field we touch
const MIN_FONT_SIZE  = 6;                  // long values shrink to fit their box, never below this

// ─── Checkbox map (derived from each widget's page + rectangle; names are generic) ─
// The PDF names its 17 checkboxes "Check Box3"…"Check Box19" and "Check Box100". They were
// mapped by inspecting each widget's page and position against the printed label to its right
// (PDF points, origin top-left, all pages 612×792).
//
//   PAGE 1 — Section I
//     Check Box100  (54.7, 441.3)  Applicant seeks a Certificate to transport property between
//                                  all points in the State of Alabama          → AUTO-CHECK (always)
//   PAGE 1 — Section II  FORM OF BUSINESS (check exactly one)
//     Check Box3    (55.4, 537.4)  CORPORATION                                   → Business_Structure contains "Corp"
//     Check Box4    (306.5, 537.3) LIMITED LIABILITY COMPANY (LLC)               → contains "LLC"
//     Check Box5    (55.0, 565.5)  LIMITED PARTNERSHIP (LP)                      → explicit "Limited Partnership"/"LP" only
//     Check Box6    (306.6, 564.5) LIMITED LIABILITY PARTNERSHIP (LLP)           → explicit "LLP" only
//     Check Box7    (54.7, 592.3)  SOLE PROPRIETORSHIP                           → contains "Sole" or "Individual"
//     Check Box8    (55.0, 618.3)  PARTNERSHIP (Identify partners)               → contains "Partnership" (general)
//     Check Box9    (55.3, 665.3)  OTHER (identify)                              → never auto-checked
//   PAGE 2 — Section II continued (registration)                               → all left BLANK
//     Check Box10   (55.1,  99.8)  Alabama corporation, LLC, LP, or LLP
//     Check Box11   (55.1, 128.9)  Out of State Corporation, LLC, LP, or LLP
//     Check Box12   (307.1, 157.7) Attach Certificate of Registration from the AL Secretary of State
//   PAGE 2 — Section III                                                        → all left BLANK
//     Check Box13   (54.4, 386.2)  Required insurance and Forms E and H filed
//     Check Box14   (54.8, 416.0)  $100.00 filing fee paid
//     Check Box15   (54.8, 433.6)  Financial statement attached as Appendix "C"
//     Check Box16   (54.8, 462.8)  UCR receipt attached / Form B-2
//   PAGE 2 — Section IV                                                         → all left BLANK
//     Check Box17   (55.1, 528.2)  Safety fitness rating from USDOT (Attachment "D")
//     Check Box18   (55.1, 569.5)  Appendix "D" safety program description attached
//   PAGE 2 — Section V                                                          → left BLANK
//     Check Box19   (54.7, 703.7)  Proof of U.S. Citizenship form attached
const CB = {
  certificate: 'Check Box100',
  corp: 'Check Box3', llc: 'Check Box4', lp: 'Check Box5', llp: 'Check Box6',
  sole: 'Check Box7', partnership: 'Check Box8', other: 'Check Box9'
};

// ─── Worker / Zoho access ────────────────────────────────────────────────────
class AuthRequiredError extends Error {
  constructor() { super('Sign-in required'); this.name = 'AuthRequiredError'; }
}
async function callWorker(url) {
  let res;
  try { res = await fetch(url, { credentials: 'include' }); }
  catch (e) { throw new AuthRequiredError(); }
  if (res.status === 401 || res.status === 403 || res.redirected) throw new AuthRequiredError();
  if (!res.ok) throw new Error(`Worker returned ${res.status}`);
  const ct = res.headers.get('content-type') || '';
  if (!ct.includes('json')) throw new AuthRequiredError();
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}
async function searchDeals(q) {
  const data = await callWorker(`${WORKER}?action=search&word=${encodeURIComponent(q)}`);
  return Array.isArray(data) ? data : [];
}
async function fetchDeal(id) {
  return callWorker(`${WORKER}?action=deal&id=${encodeURIComponent(id)}`);
}

// ─── Helpers ─────────────────────────────────────────────────────────────────
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const clean = v => (v == null ? '' : String(v).trim());

// Placeholder values that mean "nothing on file" (MC number, DBA, etc.).
function realValue(v) {
  const s = clean(v);
  return ['', 'n/a', 'na', 'none', '-none-', 'tbd', 'pending'].includes(s.toLowerCase()) ? '' : s;
}

// 10 US digits from any phone formatting; '' if it isn't a standard number.
function phoneDigits(v) {
  let n = clean(v).replace(/\D/g, '');
  if (n.length === 11 && n[0] === '1') n = n.slice(1);
  return n.length === 10 ? n : '';
}
// (###) ###-#### when it's a standard US number; otherwise the original text.
function formatPhone(v) {
  const n = phoneDigits(v);
  return n ? `(${n.slice(0,3)}) ${n.slice(3,6)}-${n.slice(6)}` : clean(v);
}
// Page 1 splits the phone into an area-code box and a number box.
function phoneParts(v) {
  const n = phoneDigits(v);
  if (n) return { area: n.slice(0,3), number: `${n.slice(3,6)}-${n.slice(6)}` };
  return { area: '', number: clean(v) };   // non-standard: keep whatever is on file in the number box
}

// Spelled-out state name → USPS 2-letter code; valid 2-letter codes pass through; anything else as typed.
const STATE_ABBR = {
  'Alabama':'AL','Alaska':'AK','Arizona':'AZ','Arkansas':'AR','California':'CA','Colorado':'CO',
  'Connecticut':'CT','Delaware':'DE','District of Columbia':'DC','Florida':'FL','Georgia':'GA',
  'Hawaii':'HI','Idaho':'ID','Illinois':'IL','Indiana':'IN','Iowa':'IA','Kansas':'KS','Kentucky':'KY',
  'Louisiana':'LA','Maine':'ME','Maryland':'MD','Massachusetts':'MA','Michigan':'MI','Minnesota':'MN',
  'Mississippi':'MS','Missouri':'MO','Montana':'MT','Nebraska':'NE','Nevada':'NV','New Hampshire':'NH',
  'New Jersey':'NJ','New Mexico':'NM','New York':'NY','North Carolina':'NC','North Dakota':'ND','Ohio':'OH',
  'Oklahoma':'OK','Oregon':'OR','Pennsylvania':'PA','Rhode Island':'RI','South Carolina':'SC',
  'South Dakota':'SD','Tennessee':'TN','Texas':'TX','Utah':'UT','Vermont':'VT','Virginia':'VA',
  'Washington':'WA','West Virginia':'WV','Wisconsin':'WI','Wyoming':'WY'
};
const STATE_CODES = new Set(Object.values(STATE_ABBR));
function stateAbbrev(name) {
  const key = clean(name);
  if (!key) return '';
  const up = key.toUpperCase();
  for (const full in STATE_ABBR) if (full.toUpperCase() === up) return STATE_ABBR[full];
  if (up.length === 2 && STATE_CODES.has(up)) return up;
  return key;   // not recognizable — leave as typed so staff can see and fix it
}

function ownerName(deal) {
  return clean(deal.Owner_1_Full_Name) || clean(deal.Contact_Name && deal.Contact_Name.name);
}

// Address blocks. Business address = Physical_* (the form requires a physical address).
// Mailing address = Mailing_* with a per-field fallback to Physical_* when Zoho has no mailing value.
function physicalAddress(deal) {
  return { street: clean(deal.Physical_Street), city: clean(deal.Physical_City), state: stateAbbrev(deal.Physical_State), zip: clean(deal.Physical_Zip) };
}
function mailingAddress(deal) {
  const p = physicalAddress(deal);
  return {
    street: clean(deal.Mailing_Street)   || p.street,
    city:   clean(deal.Mailing_City)     || p.city,
    state:  stateAbbrev(deal.Mailing_State) || p.state,
    zip:    clean(deal.Mailing_Zip_Code) || p.zip,
    fromPhysical: !clean(deal.Mailing_Street) && !clean(deal.Mailing_City)
  };
}

// FORM OF BUSINESS → exactly one checkbox key (or null when Business_Structure doesn't match anything).
function businessCheckbox(deal) {
  const b = clean(deal.Business_Structure).toLowerCase();
  if (!b) return null;
  if (b.includes('llp') || b.includes('limited liability partnership')) return 'llp';
  if (b.includes('llc') || b.includes('limited liability company'))     return 'llc';
  if (b.includes('corp'))                                                return 'corp';
  if (/\blp\b/.test(b) || b.includes('limited partnership'))            return 'lp';
  if (b.includes('partnership'))                                         return 'partnership';
  if (b.includes('sole') || b.includes('individual'))                    return 'sole';
  return null;
}
const BIZ_LABEL = { corp: 'Corporation', llc: 'Limited Liability Company (LLC)', lp: 'Limited Partnership (LP)', llp: 'Limited Liability Partnership (LLP)', sole: 'Sole Proprietorship', partnership: 'Partnership', other: 'Other' };

// Form B-2 (page 7) is only for intrastate-only carriers without an MC number. Drop it when the
// carrier has an MC number on file OR is flagged Interstate.
function b2Decision(deal) {
  const mc = realValue(deal.MC_Number);
  const interstate = deal.Interstate === true || String(deal.Interstate).toLowerCase() === 'true';
  if (mc)         return { keep: false, reason: `MC number ${mc} on file` };
  if (interstate) return { keep: false, reason: 'Deal is flagged Interstate' };
  return { keep: true, reason: 'intrastate-only carrier with no MC number' };
}

// ─── Field mapping → PDF field names (exact, case-sensitive) ─────────────────
function mapFields(deal) {
  const t = {};
  const set = (k, v) => { const s = clean(v); if (s) t[k] = s; };
  const phys = physicalAddress(deal);
  const mail = mailingAddress(deal);
  const ph   = phoneParts(deal.Business_Phone_Number);
  const owner = ownerName(deal);
  const title = clean(deal.Applicant_Title1);
  const dba   = realValue(deal.DBA);

  // PAGE 1 — Section I
  set('Legal name', deal.Deal_Name);
  set('Trade name', dba);
  set('Must be a physical address  cannot be a post office box', phys.street);
  set('City',  phys.city);
  set('State', phys.state);
  set('Zip',   phys.zip);
  set('Mailing Address', mail.street);
  set('City_2',  mail.city);
  set('State_2', mail.state);
  set('Zip_2',   mail.zip);
  set('Phone_are_code', ph.area);
  set('Phone_number',   ph.number);
  set('Email address',  deal.Email);
  // 'PARTNERSHIP Identify partners', 'undefined' (OTHER identify), 'All Individual and Partner…' — blank

  // PAGE 2 — Section II continued
  set('USDOT', realValue(deal.USDOT));
  set('MC',    realValue(deal.MC_Number));
  // 'State of Organization', 'APSC', 'Applicant proposes to use approximately number of' — blank

  // PAGE 3 — Section VI contact person (OATH block below it stays entirely blank)
  set('Name',     owner);
  set('Address',  phys.street);
  set('City_30',  phys.city);
  set('State_30', phys.state);
  set('Zip_30',   phys.zip);
  set('Telephone Number 2', formatPhone(deal.Business_Phone_Number));
  set('Email Address 2',    deal.Email);
  // 'Facsimile Number' — blank

  // PAGE 4 — Appendix B (vehicle rows, Date stay blank)
  set('Legal Name',        deal.Deal_Name);
  set('Mailing Address 3', mail.street);
  set('City4',  mail.city);
  set('State4', mail.state);
  set('Zip4',   mail.zip);
  set('Title',  title);

  // PAGE 5 — Appendix C: applicant fills entirely. Nothing set.

  // PAGE 6 — Appendix D
  set('Title_2', title);                              // "I, ___ (Title) of ___" — see splitSharedWidgets()
  set('Name of Applicant Company',   deal.Deal_Name);
  set('Name of Applicant Company_2', deal.Deal_Name);
  set('Name of Applicant Company_3', deal.Deal_Name);
  set('Printed Name of Company Representative', owner);

  // PAGE 7 — Form B-2 (only present when b2Decision().keep)
  set('LEGAL NAME', deal.Deal_Name);
  set('DBA',        dba);
  set('Mailing Address 5', mail.street);
  set('City8',      mail.city);
  set('State8',     mail.state);
  set('ZIP CODE_8', mail.zip);
  set('Title_7',    title);                           // page-7 Title widget, split off from Title_2
  set('Contact phone number', formatPhone(deal.Business_Phone_Number));
  // 'Date_7' (page-7 date widget, split off from Title_2), vehicle rows, cert/permit no. — blank

  const checks = [CB.certificate];
  const biz = businessCheckbox(deal);
  if (biz && CB[biz]) checks.push(CB[biz]);

  return { text: t, checks, biz, b2: b2Decision(deal) };
}

// ─── PDF fill ────────────────────────────────────────────────────────────────
// The source PDF shares ONE field name ("Title_2") across three widgets: the Title blank on
// page 6 and BOTH the Title and the Date blanks on page 7. Filling it would put the title into
// the page-7 Date line. Give the two page-7 widgets their own field names ("Title_7", "Date_7")
// before filling so each blank can be set independently.
function splitSharedWidgets(pdfDoc, form) {
  const { PDFName, PDFString } = PDFLib;
  const field = form.getFieldMaybe('Title_2');
  if (!field) return;
  const p7ref = pdfDoc.getPages()[6] && pdfDoc.getPages()[6].ref;
  if (!p7ref) return;
  const parent = field.acroField;
  const kids   = parent.Kids();
  if (!kids) return;
  const da = parent.DA();
  for (let i = kids.size() - 1; i >= 0; i--) {
    const ref = kids.get(i);
    const dict = pdfDoc.context.lookup(ref);
    const P = dict && dict.get(PDFName.of('P'));
    if (!P || P.toString() !== p7ref.toString()) continue;
    const rect = dict.get(PDFName.of('Rect'));
    const x = rect ? Number(rect.get(0).toString()) : 0;
    kids.remove(i);
    dict.delete(PDFName.of('Parent'));
    dict.set(PDFName.of('T'),  PDFString.of(x > 450 ? 'Date_7' : 'Title_7'));   // right-hand blank is the Date
    dict.set(PDFName.of('FT'), PDFName.of('Tx'));
    if (da) dict.set(PDFName.of('DA'), da);
    form.acroForm.addField(ref);
  }
}

// Remove page 7 (Form B-2) cleanly: first drop every field whose widgets all live on that page
// (so the AcroForm has no orphan widgets), then remove the page itself.
function dropPage7(pdfDoc, form) {
  const p7 = pdfDoc.getPages()[6];
  if (!p7) return;
  const p7key = p7.ref.toString();
  for (const f of form.getFields()) {
    const widgets = f.acroField.getWidgets();
    const onP7 = widgets.filter(w => { const P = w.P(); return P && P.toString() === p7key; });
    if (widgets.length && onP7.length === widgets.length) { try { form.removeField(f); } catch (e) {} }
  }
  pdfDoc.removePage(6);
}

async function fillPDF(pdfUrl, mapped) {
  const resp = await fetch(pdfUrl, { cache: 'reload' });
  if (!resp.ok) throw new Error(`Could not load form PDF (${resp.status}). Ensure ${pdfUrl} is in the GitHub repo.`);
  const bytes  = await resp.arrayBuffer();
  const pdfDoc = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption: true });
  const form   = pdfDoc.getForm();
  const helv   = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);

  splitSharedWidgets(pdfDoc, form);

  // Text fields: fixed 10pt for a uniform look (the PDF's own fields are "auto" size, which
  // renders big and uneven). A value wider than its box shrinks — only that value — to fit.
  for (const [name, value] of Object.entries(mapped.text)) {
    let field;
    try { field = form.getTextField(name); } catch (e) { continue; }
    const w = field.acroField.getWidgets()[0];
    const boxW = w ? w.getRectangle().width - 6 : 9999;
    let size = FILL_FONT_SIZE;
    while (size > MIN_FONT_SIZE && helv.widthOfTextAtSize(value, size) > boxW) size -= 0.5;
    try { field.setFontSize(size); } catch (e) {}
    try { field.setText(value); } catch (e) {}
  }
  // Every other text field: keep it empty but pin the same size so staff edits match.
  for (const f of form.getFields()) {
    if (f instanceof PDFLib.PDFTextField && !(f.getName() in mapped.text)) { try { f.setFontSize(FILL_FONT_SIZE); } catch (e) {} }
  }
  // Checkboxes
  for (const name of mapped.checks) {
    try { form.getCheckBox(name).check(); } catch (e) {}
  }
  form.getFields().forEach(f => { try { f.updateAppearances(helv); } catch (e) {} });

  // Fill first, then drop page 7 when it isn't needed (the remaining fields keep their values).
  if (!mapped.b2.keep) dropPage7(pdfDoc, form);

  // NOT flattened — fields stay editable so staff can adjust values in any PDF viewer.
  return pdfDoc.save();
}

function downloadPDF(bytes, prefix, dealName) {
  const name = (dealName || 'client').replace(/[^a-zA-Z0-9]/g, '_');
  const blob = new Blob([bytes], { type: 'application/pdf' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${prefix}_${name}.pdf`;
  a.click();
}

// ─── UI ──────────────────────────────────────────────────────────────────────
const app = document.getElementById('app');

function renderLoading(msg) {
  app.innerHTML = `<div class="card loading-box"><div class="spinner"></div>${esc(msg)}</div>`;
}
function renderSignIn(retryFn) {
  app.innerHTML = `
    <div class="card">
      <div class="card-title">Sign-in required</div>
      <p style="font-size:14px;color:#475569;margin-bottom:16px">
        Sign in with your <b>@truckersauthority.com</b> account to use this tool.
      </p>
      <button class="btn btn-primary" id="signin">Sign in via Cloudflare</button>
      <p class="hint" style="margin-top:14px">After signing in the tab will close and you'll return here automatically.</p>
    </div>`;
  document.getElementById('signin').onclick = () => {
    const w = window.open(WORKER, 'tasignin', 'width=520,height=640');
    const t = setInterval(() => {
      if (!w || w.closed) { clearInterval(t); if (retryFn) retryFn(); else location.reload(); }
    }, 500);
  };
}

function renderSearch(err) {
  app.innerHTML = `
    <div class="card">
      <div class="card-title">Search deal</div>
      <div class="search-row">
        <input type="text" id="si" placeholder="Company name, DOT #, owner name…" autofocus>
        <button class="btn btn-primary" id="sb">Search →</button>
      </div>
      ${err ? `<div class="error-box">${esc(err)}</div>` : ''}
      <p class="hint" style="margin-top:10px">Search any Deal from Zoho CRM by company name or DOT number. This form applies to carriers whose physical address is in Alabama.</p>
    </div>`;
  const go = async () => {
    const q = document.getElementById('si').value.trim();
    if (!q) return;
    renderLoading(`Searching for "${q}"…`);
    try {
      const results = await searchDeals(q);
      if (!results.length) renderSearch(`No deals found for "${q}".`);
      else renderDealPick(results);
    } catch(e) {
      if (e instanceof AuthRequiredError) renderSignIn(go);
      else renderSearch('Error: ' + e.message);
    }
  };
  document.getElementById('sb').onclick = go;
  document.getElementById('si').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

function renderDealPick(results) {
  app.innerHTML = `
    <div class="card">
      <div class="back-row">
        <div class="card-title" style="margin-bottom:0">Select a deal</div>
        <button class="btn btn-ghost" id="bb">← Back</button>
      </div>
      ${results.map(r => `<div class="result-item" data-id="${esc(r.id)}">
        <div>
          <div class="result-name">${esc(r.Deal_Name || r.id)}</div>
          <div class="result-meta">${[r.Stage, r.USDOT ? 'DOT# ' + r.USDOT : null, r.Owner_1_Full_Name, [r.Physical_City, r.Physical_State].filter(Boolean).join(', ')].filter(Boolean).map(esc).join('  ·  ')}</div>
        </div>
        <span style="color:#94a3b8;font-size:20px">›</span>
      </div>`).join('')}
    </div>`;
  document.getElementById('bb').onclick = () => renderSearch(null);
  document.querySelectorAll('.result-item').forEach(el => {
    el.onclick = async () => {
      renderLoading('Loading ' + el.querySelector('.result-name').textContent + '…');
      try { renderPreview(await fetchDeal(el.dataset.id)); }
      catch(e) {
        if (e instanceof AuthRequiredError) renderSignIn(() => el.onclick());
        else renderSearch('Error: ' + e.message);
      }
    };
  });
}

function fRow(label, value, note) {
  if (!value && !note) return '';
  return `<div class="field-row"><span class="field-label">${esc(label)}</span><span class="field-value">${esc(value)}${note ? ` <span class="muted">${esc(note)}</span>` : ''}</span></div>`;
}

function renderPreview(deal) {
  const m     = mapFields(deal);
  const phys  = physicalAddress(deal);
  const mail  = mailingAddress(deal);
  const ph    = phoneParts(deal.Business_Phone_Number);
  const isAL  = phys.state === 'AL';
  const line  = a => [a.street, [a.city, a.state, a.zip].filter(Boolean).join(', ')].filter(Boolean).join(' · ');
  app.innerHTML = `
    <div class="card">
      <div class="back-row">
        <div><div class="card-title" style="margin-bottom:0">Confirm data</div><div class="deal-title">${esc(deal.Deal_Name || '')}</div></div>
        <button class="btn btn-ghost" id="bb">← Search</button>
      </div>
      ${!isAL ? `<div class="warn-box">⚠ Physical state is <b>${esc(phys.state || '(blank)')}</b>, not AL. Form 14A is an Alabama intrastate application — confirm this is the right form for this carrier.</div>` : ''}
      <div class="owner-box">
        <div class="section-label">Section I — Applicant</div>
        ${fRow('Legal name', deal.Deal_Name)}
        ${fRow('Trade name (DBA)', realValue(deal.DBA))}
        ${fRow('Business address', line(phys))}
        ${fRow('Mailing address', line(mail), mail.fromPhysical ? '(same as physical)' : '')}
        ${fRow('Phone', ph.area ? `(${ph.area}) ${ph.number}` : ph.number)}
        ${fRow('Email', deal.Email)}
      </div>
      <div class="section">
        <div class="section-label">Section II — Form of business &amp; numbers</div>
        ${fRow('Business structure', clean(deal.Business_Structure) || '—', m.biz ? `→ checks “${BIZ_LABEL[m.biz]}”` : '→ no box checked (mark by hand)')}
        ${fRow('USDOT #', realValue(deal.USDOT))}
        ${fRow('MC #', realValue(deal.MC_Number) || '—')}
      </div>
      <div class="section">
        <div class="section-label">Section VI &amp; appendices — contact / signer</div>
        ${fRow('Contact person', ownerName(deal) || '—')}
        ${fRow('Title', clean(deal.Applicant_Title1) || '—')}
      </div>
      <div class="${m.b2.keep ? 'info-box' : 'info-box'}">
        <b>Form B-2 (page 7):</b> ${m.b2.keep
          ? `included <span class="pill pill-on">7 pages</span><br>Reason: ${esc(m.b2.reason)}.`
          : `removed <span class="pill pill-off">6 pages</span><br>Reason: ${esc(m.b2.reason)} — B-2 is only for intrastate-only carriers without an MC number.`}
      </div>
      <div class="warn-box">
        ⚠ Auto-checked: the Section I certificate box${m.biz ? ` and “${esc(BIZ_LABEL[m.biz])}”` : ''}. Every other checkbox (registration, Section III–V), the page 3 OATH / notary block, Appendix C financials, vehicle lists, signatures and dates are left blank for staff or the applicant to complete.
      </div>
      <button class="btn btn-success" id="gb">⬇ Generate &amp; Download Alabama Form 14A</button>
      <div id="ge" class="error-box" style="display:none"></div>
    </div>`;
  document.getElementById('bb').onclick = () => renderSearch(null);
  document.getElementById('gb').onclick = async () => {
    const btn = document.getElementById('gb');
    btn.disabled = true; btn.textContent = 'Generating PDF…';
    try {
      const bytes = await fillPDF(PDF_URL, m);
      downloadPDF(bytes, 'AL-Form-14A', deal.Deal_Name);
      renderDone(deal, m);
    } catch(e) {
      const err = document.getElementById('ge');
      err.style.display = 'block'; err.textContent = 'Error: ' + e.message;
      btn.disabled = false; btn.textContent = '⬇ Generate & Download Alabama Form 14A';
    }
  };
}

function renderDone(deal, m) {
  app.innerHTML = `
    <div class="card">
      <div class="success-box">
        <div class="check-circle">✓</div>
        <h2 style="font-size:20px;font-weight:600;margin-bottom:6px">Alabama Form 14A Downloaded!</h2>
        <p style="color:#64748b;font-size:14px;margin-bottom:6px">${esc(deal.Deal_Name || '')} — ${m.b2.keep ? '7 pages (Form B-2 included)' : '6 pages (Form B-2 removed)'}</p>
        <p style="color:#92400e;font-size:12px;background:#fefce8;border:1px solid #fde68a;padding:8px 12px;border-radius:6px;margin-bottom:20px">Review every page. Fields stay editable in your PDF viewer; the OATH block must be signed before a notary.</p>
        <button class="btn btn-ghost" id="ab" style="margin-right:8px">Search Another Deal</button>
        <button class="btn btn-ghost" id="rb">Re-download PDF</button>
      </div>
    </div>`;
  document.getElementById('ab').onclick = () => renderSearch(null);
  document.getElementById('rb').onclick = async () => {
    try { downloadPDF(await fillPDF(PDF_URL, m), 'AL-Form-14A', deal.Deal_Name); }
    catch(e) { alert('Error: ' + e.message); }
  };
}

// ─── Boot: handle deep-links from the "Generate Form" button (?id=DEAL_ID) ────
(async function boot() {
  const id = new URLSearchParams(window.location.search).get('id');
  if (!id) { renderSearch(null); return; }
  const load = async () => renderPreview(await fetchDeal(id));
  renderLoading('Loading deal from Zoho CRM…');
  try { await load(); }
  catch(e) {
    if (e instanceof AuthRequiredError) {
      renderSignIn(async () => {
        renderLoading('Loading deal from Zoho CRM…');
        try { await load(); }
        catch(err) { renderSearch('Could not load deal: ' + err.message); }
      });
    } else {
      renderSearch('Could not load deal: ' + e.message);
    }
  }
})();
</script>
</body>
</html>
